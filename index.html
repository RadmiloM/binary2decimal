<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Binary to decimal</title>
</head>

<body>
    <form>
        <label for="binary-number">Enter binary number(up to 8 digits): </label>
        <input type="text" id="binary-number" name="binary" maxlength="8" pattern="[01]{1,8}" required>
        <small id="error-message"></small>
        <script src="script.js"></script>
    </form>
</body>

</html>
